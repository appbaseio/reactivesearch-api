<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="rsBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6C5CE7"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="esBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#24B5A0"/>
      <stop offset="100%" stop-color="#1a9a87"/>
    </linearGradient>
    <linearGradient id="clientBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="580" rx="16" fill="#f8fafc"/>

  <!-- ==================== LEFT: Client Applications ==================== -->
  <g transform="translate(30, 35)">
    <text x="80" y="0" text-anchor="middle" font-size="12" font-weight="600" fill="#64748b" letter-spacing="1.5">CLIENT APPS</text>

    <!-- Web App -->
    <rect x="10" y="16" width="140" height="52" rx="10" fill="url(#clientBg)" filter="url(#shadow)"/>
    <!-- Globe icon -->
    <g transform="translate(80, 35)">
      <circle cx="0" cy="0" r="7" fill="none" stroke="white" stroke-width="1.3"/>
      <ellipse cx="0" cy="0" rx="3.5" ry="7" fill="none" stroke="white" stroke-width="1"/>
      <line x1="-7" y1="0" x2="7" y2="0" stroke="white" stroke-width="0.8"/>
      <line x1="-6" y1="-3.5" x2="6" y2="-3.5" stroke="white" stroke-width="0.6"/>
      <line x1="-6" y1="3.5" x2="6" y2="3.5" stroke="white" stroke-width="0.6"/>
    </g>
    <text x="80" y="55" text-anchor="middle" font-size="12" font-weight="600" fill="white">Web App</text>

    <!-- Mobile App -->
    <rect x="10" y="80" width="140" height="52" rx="10" fill="url(#clientBg)" filter="url(#shadow)"/>
    <!-- Phone icon -->
    <g transform="translate(80, 99)">
      <rect x="-5" y="-8" width="10" height="16" rx="2" fill="none" stroke="white" stroke-width="1.3"/>
      <line x1="-2" y1="5" x2="2" y2="5" stroke="white" stroke-width="1" stroke-linecap="round"/>
    </g>
    <text x="80" y="119" text-anchor="middle" font-size="12" font-weight="600" fill="white">Mobile App</text>

    <!-- Backend -->
    <rect x="10" y="144" width="140" height="52" rx="10" fill="url(#clientBg)" filter="url(#shadow)"/>
    <!-- Gear icon -->
    <g transform="translate(80, 163)">
      <circle cx="0" cy="0" r="4" fill="none" stroke="white" stroke-width="1.3"/>
      <g stroke="white" stroke-width="1.3" stroke-linecap="round">
        <line x1="0" y1="-7" x2="0" y2="-5"/><line x1="0" y1="5" x2="0" y2="7"/>
        <line x1="-7" y1="0" x2="-5" y2="0"/><line x1="5" y1="0" x2="7" y2="0"/>
        <line x1="-5" y1="-5" x2="-3.5" y2="-3.5"/><line x1="3.5" y1="3.5" x2="5" y2="5"/>
        <line x1="5" y1="-5" x2="3.5" y2="-3.5"/><line x1="-3.5" y1="3.5" x2="-5" y2="5"/>
      </g>
    </g>
    <text x="80" y="183" text-anchor="middle" font-size="11" font-weight="600" fill="white">Backend Service</text>

    <!-- UI Libraries box -->
    <rect x="0" y="220" width="160" height="240" rx="12" fill="white" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>
    <text x="80" y="244" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b" letter-spacing="0.5">UI LIBRARIES</text>
    <line x1="15" y1="254" x2="145" y2="254" stroke="#e2e8f0" stroke-width="1"/>

    <!-- React -->
    <circle cx="35" cy="274" r="5" fill="none" stroke="#61DAFB" stroke-width="1"/>
    <circle cx="35" cy="274" r="1.5" fill="#61DAFB"/>
    <text x="52" y="278" font-size="12" fill="#334155">React</text>

    <!-- Vue -->
    <polygon points="29,290 35,300 41,290" fill="none" stroke="#42B883" stroke-width="1.2" stroke-linejoin="round"/>
    <text x="52" y="299" font-size="12" fill="#334155">Vue</text>

    <!-- React Native -->
    <circle cx="35" cy="315" r="5" fill="none" stroke="#61DAFB" stroke-width="0.8" stroke-dasharray="2,1.5"/>
    <circle cx="35" cy="315" r="1.5" fill="#61DAFB"/>
    <text x="52" y="319" font-size="12" fill="#334155">React Native</text>

    <!-- Flutter -->
    <g transform="translate(35, 337)">
      <path d="M-4,-5 L4,0 L-4,5 Z" fill="#54C5F8" stroke="none"/>
    </g>
    <text x="52" y="341" font-size="12" fill="#334155">Flutter</text>

    <!-- JavaScript -->
    <rect x="30" y="352" width="10" height="10" rx="1.5" fill="#F7DF1E"/>
    <text x="33" y="361" font-size="7" font-weight="700" fill="#333">JS</text>
    <text x="52" y="361" font-size="12" fill="#334155">JavaScript</text>

    <!-- No-Code Builder -->
    <g transform="translate(35, 378)">
      <rect x="-5" y="-5" width="10" height="10" rx="2" fill="none" stroke="#a855f7" stroke-width="1.2"/>
      <line x1="-2" y1="0" x2="2" y2="0" stroke="#a855f7" stroke-width="1" stroke-linecap="round"/>
      <line x1="0" y1="-2" x2="0" y2="2" stroke="#a855f7" stroke-width="1" stroke-linecap="round"/>
    </g>
    <text x="52" y="382" font-size="12" fill="#334155">No-Code Builder</text>

    <!-- REST API -->
    <g transform="translate(35, 400)">
      <path d="M-5,-3 L5,-3 L5,3 L-5,3 Z" fill="none" stroke="#f97316" stroke-width="1.2" rx="1"/>
      <text x="0" y="2" text-anchor="middle" font-size="5" font-weight="700" fill="#f97316">API</text>
    </g>
    <text x="52" y="404" font-size="12" fill="#334155">REST API</text>
  </g>

  <!-- ==================== Arrows: Client → ReactiveSearch ==================== -->
  <g>
    <!-- Dashed connection lines from apps -->
    <line x1="180" y1="77" x2="290" y2="170" stroke="#b0bec5" stroke-width="1.2" stroke-dasharray="5,4"/>
    <line x1="180" y1="141" x2="290" y2="210" stroke="#b0bec5" stroke-width="1.2" stroke-dasharray="5,4"/>
    <line x1="180" y1="205" x2="290" y2="250" stroke="#b0bec5" stroke-width="1.2" stroke-dasharray="5,4"/>
    <!-- From UI libraries -->
    <line x1="180" y1="370" x2="290" y2="310" stroke="#b0bec5" stroke-width="1.2" stroke-dasharray="5,4"/>

    <!-- Main bidirectional arrow -->
    <line x1="198" y1="260" x2="283" y2="260" stroke="#7c83db" stroke-width="2"/>
    <!-- Right arrowhead -->
    <polygon points="283,255 293,260 283,265" fill="#6C5CE7"/>
    <!-- Left arrowhead -->
    <polygon points="198,255 188,260 198,265" fill="#3B82F6"/>
    <text x="240" y="252" text-anchor="middle" font-size="10" font-weight="500" fill="#64748b">API</text>
  </g>

  <!-- ==================== CENTER: ReactiveSearch ==================== -->
  <g transform="translate(298, 50)">
    <!-- Main container -->
    <rect x="0" y="0" width="320" height="420" rx="16" fill="white" stroke="#6C5CE7" stroke-width="2" filter="url(#shadow)"/>

    <!-- Header bar -->
    <rect x="0" y="0" width="320" height="62" rx="16" fill="url(#rsBg)"/>
    <rect x="0" y="46" width="320" height="16" fill="url(#rsBg)"/>

    <!-- Flask icon in header -->
    <g transform="translate(60, 10)">
      <rect x="0" y="0" width="36" height="38" rx="8" fill="rgba(255,255,255,0.2)"/>
      <g transform="translate(18, 19)">
        <path d="M-4,-11 L-4,-3 L-12,9 Q-13,11 -11,12 L11,12 Q13,11 12,9 L4,-3 L4,-11" fill="none" stroke="white" stroke-width="1.6" stroke-linejoin="round"/>
        <line x1="-7" y1="-11" x2="7" y2="-11" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M-9,6 Q0,2 9,6" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
      </g>
    </g>
    <text x="188" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="white">ReactiveSearch</text>
    <text x="160" y="52" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.8)">API Gateway</text>

    <!-- Feature grid -->
    <!-- Row 1: Search Relevancy -->
    <g transform="translate(16, 78)">
      <rect x="0" y="0" width="137" height="66" rx="8" fill="#f8f7ff" stroke="#e4e0f7" stroke-width="1"/>
      <!-- Magnifying glass icon -->
      <g transform="translate(68, 24)">
        <circle cx="0" cy="-1" r="6" fill="none" stroke="#6C5CE7" stroke-width="1.5"/>
        <line x1="4" y1="3" x2="8" y2="7" stroke="#6C5CE7" stroke-width="1.5" stroke-linecap="round"/>
      </g>
      <text x="68" y="50" text-anchor="middle" font-size="11" font-weight="600" fill="#4c1d95">Search Relevancy</text>
    </g>

    <!-- Row 1: Pipelines -->
    <g transform="translate(166, 78)">
      <rect x="0" y="0" width="137" height="66" rx="8" fill="#f8f7ff" stroke="#e4e0f7" stroke-width="1"/>
      <!-- Pipeline/flow icon -->
      <g transform="translate(68, 24)" stroke="#6C5CE7" stroke-width="1.5" fill="none" stroke-linecap="round">
        <circle cx="-8" cy="0" r="3"/>
        <line x1="-5" y1="0" x2="-1" y2="0"/>
        <circle cx="2" cy="0" r="3"/>
        <line x1="5" y1="0" x2="9" y2="0"/>
        <polygon points="9,-2 13,0 9,2" fill="#6C5CE7" stroke="none"/>
      </g>
      <text x="68" y="50" text-anchor="middle" font-size="11" font-weight="600" fill="#4c1d95">Pipelines</text>
    </g>

    <!-- Row 2: AI Search -->
    <g transform="translate(16, 156)">
      <rect x="0" y="0" width="137" height="66" rx="8" fill="#f8f7ff" stroke="#e4e0f7" stroke-width="1"/>
      <!-- Brain/AI icon -->
      <g transform="translate(68, 24)">
        <circle cx="0" cy="0" r="7" fill="none" stroke="#6C5CE7" stroke-width="1.3"/>
        <path d="M-3,-3 Q0,-6 3,-3" fill="none" stroke="#6C5CE7" stroke-width="1.2"/>
        <path d="M-4,0 Q0,4 4,0" fill="none" stroke="#6C5CE7" stroke-width="1.2"/>
        <circle cx="-2" cy="-1" r="1" fill="#6C5CE7"/>
        <circle cx="2" cy="-1" r="1" fill="#6C5CE7"/>
      </g>
      <text x="68" y="50" text-anchor="middle" font-size="11" font-weight="600" fill="#4c1d95">AI Search</text>
    </g>

    <!-- Row 2: Analytics -->
    <g transform="translate(166, 156)">
      <rect x="0" y="0" width="137" height="66" rx="8" fill="#f8f7ff" stroke="#e4e0f7" stroke-width="1"/>
      <!-- Bar chart icon -->
      <g transform="translate(68, 24)" fill="#6C5CE7">
        <rect x="-8" y="-2" width="4" height="8" rx="1"/>
        <rect x="-2" y="-6" width="4" height="12" rx="1"/>
        <rect x="4" y="-4" width="4" height="10" rx="1"/>
      </g>
      <text x="68" y="50" text-anchor="middle" font-size="11" font-weight="600" fill="#4c1d95">Analytics</text>
    </g>

    <!-- Row 3: Access Control -->
    <g transform="translate(16, 234)">
      <rect x="0" y="0" width="137" height="66" rx="8" fill="#f8f7ff" stroke="#e4e0f7" stroke-width="1"/>
      <!-- Lock icon -->
      <g transform="translate(68, 23)">
        <rect x="-6" y="-1" width="12" height="9" rx="2" fill="none" stroke="#6C5CE7" stroke-width="1.4"/>
        <path d="M-3,-1 L-3,-4 Q-3,-7 0,-7 Q3,-7 3,-4 L3,-1" fill="none" stroke="#6C5CE7" stroke-width="1.4"/>
        <circle cx="0" cy="3" r="1.2" fill="#6C5CE7"/>
      </g>
      <text x="68" y="50" text-anchor="middle" font-size="11" font-weight="600" fill="#4c1d95">Access Control</text>
    </g>

    <!-- Row 3: Speed & Caching -->
    <g transform="translate(166, 234)">
      <rect x="0" y="0" width="137" height="66" rx="8" fill="#f8f7ff" stroke="#e4e0f7" stroke-width="1"/>
      <!-- Lightning bolt icon -->
      <g transform="translate(68, 24)">
        <polygon points="-2,-8 -5,1 -1,1 -3,8 6,-2 1,-2 3,-8" fill="#6C5CE7" stroke="none"/>
      </g>
      <text x="68" y="50" text-anchor="middle" font-size="11" font-weight="600" fill="#4c1d95">Speed &amp; Caching</text>
    </g>

    <!-- Row 4: UI Builder -->
    <g transform="translate(16, 312)">
      <rect x="0" y="0" width="137" height="66" rx="8" fill="#f8f7ff" stroke="#e4e0f7" stroke-width="1"/>
      <!-- Layout/grid icon -->
      <g transform="translate(68, 24)" fill="none" stroke="#6C5CE7" stroke-width="1.3">
        <rect x="-8" y="-6" width="7" height="12" rx="1.5"/>
        <rect x="1" y="-6" width="7" height="5" rx="1.5"/>
        <rect x="1" y="1" width="7" height="5" rx="1.5"/>
      </g>
      <text x="68" y="50" text-anchor="middle" font-size="11" font-weight="600" fill="#4c1d95">UI Builder</text>
    </g>

    <!-- Row 4: Data Management -->
    <g transform="translate(166, 312)">
      <rect x="0" y="0" width="137" height="66" rx="8" fill="#f8f7ff" stroke="#e4e0f7" stroke-width="1"/>
      <!-- Database/cylinder icon -->
      <g transform="translate(68, 22)" fill="none" stroke="#6C5CE7" stroke-width="1.3">
        <ellipse cx="0" cy="-5" rx="7" ry="3"/>
        <line x1="-7" y1="-5" x2="-7" y2="5"/>
        <line x1="7" y1="-5" x2="7" y2="5"/>
        <ellipse cx="0" cy="5" rx="7" ry="3"/>
      </g>
      <text x="68" y="50" text-anchor="middle" font-size="11" font-weight="600" fill="#4c1d95">Data Management</text>
    </g>

    <!-- Footer -->
    <text x="160" y="408" text-anchor="middle" font-size="10" fill="#94a3b8">Docker-based · Open Source</text>
  </g>

  <!-- ==================== Arrows: ReactiveSearch → Search Engine ==================== -->
  <g>
    <!-- Solid bidirectional line -->
    <line x1="622" y1="260" x2="672" y2="260" stroke="#4db5a2" stroke-width="2"/>
    <!-- Right arrowhead -->
    <polygon points="672,255 682,260 672,265" fill="#24B5A0"/>
    <!-- Left arrowhead -->
    <polygon points="622,255 612,260 622,265" fill="#6C5CE7"/>
    <text x="647" y="250" text-anchor="middle" font-size="10" font-weight="500" fill="#64748b">Query</text>
    <text x="647" y="276" text-anchor="middle" font-size="10" font-weight="500" fill="#64748b">Index</text>
  </g>

  <!-- ==================== RIGHT: Elasticsearch / OpenSearch ==================== -->
  <g transform="translate(688, 90)">
    <rect x="0" y="0" width="240" height="340" rx="16" fill="white" stroke="#24B5A0" stroke-width="2" filter="url(#shadow)"/>

    <!-- Header -->
    <rect x="0" y="0" width="240" height="58" rx="16" fill="url(#esBg)"/>
    <rect x="0" y="42" width="240" height="16" fill="url(#esBg)"/>
    <text x="120" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="white">Elasticsearch</text>
    <text x="120" y="52" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.85)">or OpenSearch</text>

    <!-- Deployment options label -->
    <text x="120" y="82" text-anchor="middle" font-size="10" font-weight="600" fill="#64748b" letter-spacing="0.5">DEPLOYMENT OPTIONS</text>
    <line x1="20" y1="92" x2="220" y2="92" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Self-hosted -->
    <rect x="15" y="105" width="210" height="48" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/>
    <!-- Server icon -->
    <g transform="translate(36, 125)">
      <rect x="-8" y="-7" width="16" height="14" rx="2" fill="none" stroke="#0d9488" stroke-width="1.3"/>
      <circle cx="-4" cy="-2" r="1.2" fill="#0d9488"/>
      <line x1="-1" y1="-2" x2="5" y2="-2" stroke="#0d9488" stroke-width="1" stroke-linecap="round"/>
      <line x1="-5" y1="3" x2="5" y2="3" stroke="#0d9488" stroke-width="0.8"/>
    </g>
    <text x="56" y="124" font-size="12" font-weight="600" fill="#134e4a">Self-hosted</text>
    <text x="56" y="141" font-size="10" fill="#5eead4">Docker / Kubernetes / Bare metal</text>

    <!-- AWS OpenSearch -->
    <rect x="15" y="165" width="210" height="48" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/>
    <!-- Cloud icon -->
    <g transform="translate(36, 185)">
      <path d="M-7,3 Q-9,3 -9,0 Q-9,-3 -6,-3 Q-5,-7 0,-7 Q5,-7 6,-3 Q9,-3 9,0 Q9,3 7,3 Z" fill="none" stroke="#0d9488" stroke-width="1.3"/>
    </g>
    <text x="56" y="184" font-size="12" font-weight="600" fill="#134e4a">AWS OpenSearch</text>
    <text x="56" y="201" font-size="10" fill="#5eead4">Amazon managed service</text>

    <!-- Elastic Cloud -->
    <rect x="15" y="225" width="210" height="48" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/>
    <!-- Globe icon -->
    <g transform="translate(36, 245)">
      <circle cx="0" cy="0" r="7" fill="none" stroke="#0d9488" stroke-width="1.2"/>
      <ellipse cx="0" cy="0" rx="3.5" ry="7" fill="none" stroke="#0d9488" stroke-width="0.9"/>
      <line x1="-7" y1="0" x2="7" y2="0" stroke="#0d9488" stroke-width="0.7"/>
      <line x1="-6" y1="-3.5" x2="6" y2="-3.5" stroke="#0d9488" stroke-width="0.5"/>
      <line x1="-6" y1="3.5" x2="6" y2="3.5" stroke="#0d9488" stroke-width="0.5"/>
    </g>
    <text x="56" y="244" font-size="12" font-weight="600" fill="#134e4a">Elastic Cloud</text>
    <text x="56" y="261" font-size="10" fill="#5eead4">Elastic managed service</text>

    <!-- Footer info -->
    <line x1="20" y1="286" x2="220" y2="286" stroke="#e2e8f0" stroke-width="1"/>
    <text x="120" y="308" text-anchor="middle" font-size="10" fill="#64748b">Stores data, indices,</text>
    <text x="120" y="322" text-anchor="middle" font-size="10" fill="#64748b">analytics &amp; system indices</text>
  </g>

  <!-- ==================== Bottom caption ==================== -->
  <text x="480" y="556" text-anchor="middle" font-size="11" fill="#94a3b8">ReactiveSearch acts as an API gateway — supercharging your search cluster with relevancy controls, pipelines, analytics, AI search and access control</text>
</svg>